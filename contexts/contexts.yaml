# Elicitation contexts — places an AI tic lives, expressed as prompts that ask a
# model to PRODUCE text in that context. Each runs across copilot (GPT) + agy
# (Gemini) × n_samples, cached under scratch/ai-tics/cache/<id>/.
#
# Design notes:
#   - Ask for MANY items per call (8-12) so one elicitation yields many positives.
#   - Match the genre the hook guards (law-review / op-ed / explainer prose),
#     NOT generic creative writing.
#   - Keep prompts neutral about the tic you're hunting — you want the model's
#     DEFAULT reach, not a primed imitation.

- id: oped_closer
  n_samples: 6
  prompt: >
    Write 10 different one-sentence closing lines for op-eds. Each should tie
    together three unrelated recent news items into a single broader point.
    Output only the 10 sentences, numbered 1-10, nothing else.

- id: example_intro
  n_samples: 6
  prompt: >
    Write 10 different opening sentences that each introduce a concrete example
    to illustrate an abstract legal or economic point. Output only the 10
    sentences, numbered 1-10, nothing else.

- id: section_transition
  n_samples: 6
  prompt: >
    Write 10 different one-sentence transitions that move a reader from one
    section of a law-review article to the next, summarizing what came before
    and previewing what follows. Output only the 10 sentences, numbered 1-10.

- id: abstract_closer
  n_samples: 6
  prompt: >
    Write 10 different final sentences for the abstract of a scholarly article,
    each stating why the article's contribution matters. Output only the 10
    sentences, numbered 1-10, nothing else.

# ── Academic-prose moves (genre-matched to the journal human corpus) ─────────
# These produce connected PARAGRAPHS in the register of finance/accounting/law
# scholarship, so the n-gram diff against the journal corpus surfaces phrases
# LLMs over-use in ACADEMIC writing — the user's actual drafting context.
# Prompts stay neutral about any tic: we want the model's default reach.

- id: paper_intro
  n_samples: 5
  prompt: >
    Write the opening paragraph of an academic finance or accounting research
    paper. Pick any plausible topic. Two to four sentences motivating the
    question. Output only the paragraph — no title, no heading.

- id: hypothesis_development
  n_samples: 5
  prompt: >
    Write a paragraph from the hypothesis-development section of an empirical
    finance/accounting paper, building the theoretical argument toward a testable
    prediction. Pick any plausible topic. Output only the paragraph.

- id: results_framing
  n_samples: 5
  prompt: >
    Write a paragraph describing and interpreting the main empirical result of a
    finance/accounting study. Pick any plausible finding. Output only the
    paragraph.

- id: discussion_implications
  n_samples: 5
  prompt: >
    Write a paragraph from the discussion section of a scholarly paper explaining
    why the findings matter for theory and practice. Pick any plausible topic.
    Output only the paragraph.

- id: conclusion_para
  n_samples: 5
  prompt: >
    Write the concluding paragraph of an academic finance/accounting article,
    summarizing the contribution and noting directions for future research. Pick
    any plausible topic. Output only the paragraph.

- id: lit_review_transition
  n_samples: 5
  prompt: >
    Write a paragraph from the literature-review section of a scholarly paper
    that situates the study relative to prior work and identifies a gap. Pick any
    plausible topic. Output only the paragraph.

- id: contribution_statement
  n_samples: 5
  prompt: >
    Write a paragraph stating the contributions of an academic finance/accounting
    paper to the literature. Pick any plausible topic. Output only the paragraph.
